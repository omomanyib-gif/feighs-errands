<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sister Portal | Feigh's Errands & Supplies</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 40px auto;
            background: #121212;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #332b0c;
        }
        .login-box, .dashboard-box {
            display: none;
        }
        .active-panel {
            display: block;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0b0b0b;
            border: 1px solid #443b12;
            color: white;
            border-radius: 4px;
        }
        .admin-btn {
            background: var(--gold-primary);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .post-manage-card {
            background: #080808;
            border: 1px solid #222;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #b22222;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <a href="index.html" style="color: var(--gold-primary); text-decoration: none; font-size: 0.9rem;">← Back to Public Website</a>
        
        <!-- Login Screen -->
        <div id="loginPanel" class="login-box active-panel">
            <h2 style="color: var(--gold-primary); margin-top: 15px;">🔒 Sister Secure Login</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Enter your secret admin passcode to manage posts and community chat:</p>
            <input type="password" id="adminPasswordInput" placeholder="Enter Password..." onkeydown="if(event.key==='Enter') checkAdminPassword()">
            <button class="admin-btn" onclick="checkAdminPassword()">Log In</button>
        </div>

        <!-- Admin Dashboard (Hidden until password is correct) -->
        <div id="dashboardPanel" class="dashboard-box">
            <h2 style="color: var(--gold-primary); margin-top: 15px;">🛠️ Feigh's Control Panel</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Publish live updates or moderate community discussions.</p>
            
            <h3 style="color: var(--gold-light); font-size: 1.1rem; margin-bottom: 10px;">Post New Update</h3>
            <input type="text" id="postTitle" placeholder="Update Title (e.g., Successful Delivery in Kisumu)">
            <input type="file" id="postMedia" accept="image/*,video/*" style="border:none; padding: 0;">
            <textarea id="postContent" rows="4" placeholder="Write details about the errand or delivery..."></textarea>
            <button class="admin-btn" onclick="createNewPost()" style="margin-bottom: 30px;">Publish Update Live</button>

            <h3 style="color: var(--gold-light); font-size: 1.1rem; margin-bottom: 10px;">Manage Active Posts</h3>
            <div id="managePostsContainer"></div>

            <h3 style="color: var(--gold-light); font-size: 1.1rem; margin-top: 30px; margin-bottom: 10px;">Moderate Community Chat</h3>
            <div id="manageChatContainer" style="max-height: 200px; overflow-y: auto; background: #080808; padding: 10px; border-radius: 4px;"></div>
        </div>
    </div>

    <script>
        // Set your sister's secure password here:
        const SECRET_PASSWORD = "feighsecure2026";

        function checkAdminPassword() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === SECRET_PASSWORD) {
                document.getElementById('loginPanel').classList.remove('active-panel');
                document.getElementById('dashboardPanel').classList.add('active-panel');
                loadManageData();
            } else {
                alert('Incorrect password! Access denied.');
            }
        }

        function createNewPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const mediaInput = document.getElementById('postMedia');

            if (!title || !content) {
                alert('Please fill in both the title and content.');
                return;
            }

            const savePostData = (mediaData, mediaType) => {
                const posts = JSON.parse(localStorage.getItem('feighPosts')) || [];
                const newPost = {
                    id: Date.now(),
                    title,
                    content,
                    mediaData: mediaData || '',
                    mediaType: mediaType || '',
                    date: new Date().toLocaleDateString(),
                    comments: []
                };
                posts.unshift(newPost);
                localStorage.setItem('feighPosts', JSON.stringify(posts));
                
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postMedia').value = '';
                alert('Update published live!');
                loadManageData();
            };

            if (mediaInput.files && mediaInput.files[0]) {
                const file = mediaInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePostData(e.target.result, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                savePostData();
            }
        }

        function loadManageData() {
            // Load Posts
            const postsContainer = document.getElementById('managePostsContainer');
            const posts = JSON.parse(localStorage.getItem('feighPosts')) || [];
            
            if (posts.length === 0) {
                postsContainer.innerHTML = `<p style="font-size: 0.85rem; color: #666;">No active posts found.</p>`;
            } else {
                postsContainer.innerHTML = '';
                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-manage-card';
                    card.innerHTML = `<span style="font-size: 0.9rem;">${post.title}</span> <button class="delete-btn" onclick="deletePost(${post.id})">Delete</button>`;
                    postsContainer.appendChild(card);
                });
            }

            // Load Chat Moderation
            const chatContainer = document.getElementById('manageChatContainer');
            const chats = JSON.parse(localStorage.getItem('feighCommunityChat')) || [];

            if (chats.length === 0) {
                chatContainer.innerHTML = `<p style="font-size: 0.85rem; color: #666;">No chat messages.</p>`;
            } else {
                chatContainer.innerHTML = '';
                chats.forEach((chat, index) => {
                    const cCard = document.createElement('div');
                    cCard.className = 'post-manage-card';
                    cCard.innerHTML = `<span style="font-size: 0.85rem;"><strong>${chat.name}:</strong> ${chat.text}</span> <button class="delete-btn" onclick="deleteChat(${index})">Remove</button>`;
                    chatContainer.appendChild(cCard);
                });
            }
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('feighPosts')) || [];
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('feighPosts', JSON.stringify(posts));
            loadManageData();
        }

        function deleteChat(index) {
            let chats = JSON.parse(localStorage.getItem('feighCommunityChat')) || [];
            chats.splice(index, 1);
            localStorage.setItem('feighCommunityChat', JSON.stringify(chats));
            loadManageData();
        }
    </script>

</body>
</html>
