<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sister Portal | Feigh's Errands & Supplies</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 40px auto;
            background: #121212;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #332b0c;
        }
        .login-box, .dashboard-box {
            display: none;
        }
        .active-panel {
            display: block;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: #0b0b0b;
            border: 1px solid #443b12;
            color: white;
            border-radius: 4px;
        }
        .admin-btn {
            background: var(--gold-primary);
            color: black;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .post-manage-card {
            background: #080808;
            border: 1px solid #222;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .delete-btn {
            background: #b22222;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <a href="index.html" style="color: var(--gold-primary); text-decoration: none; font-size: 0.9rem;">← Back to Public Website</a>
        
        <!-- Login Screen -->
        <div id="loginPanel" class="login-box active-panel">
            <h2 style="color: var(--gold-primary); margin-top: 15px;">🔒 Sister Secure Login</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Enter your secret admin passcode to broadcast updates globally:</p>
            <input type="password" id="adminPasswordInput" placeholder="Enter Password..." onkeydown="if(event.key==='Enter') checkAdminPassword()">
            <button class="admin-btn" onclick="checkAdminPassword()">Log In</button>
        </div>

        <!-- Admin Dashboard -->
        <div id="dashboardPanel" class="dashboard-box">
            <h2 style="color: var(--gold-primary); margin-top: 15px;">🛠️ Feigh's Global Broadcast Portal</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px;">Upload photos or video reels to instantly publish them worldwide.</p>
            
            <h3 style="color: var(--gold-light); font-size: 1.1rem; margin-bottom: 10px;">Create New Global Post / Reel</h3>
            <input type="text" id="postTitle" placeholder="Caption Title (Optional)...">
            <label style="font-size: 0.85rem; color: #aaa;">Upload Photo or Reel Video:</label>
            <input type="file" id="postMedia" accept="image/*,video/*" style="border:none; padding: 0; margin-top: 5px;">
            <textarea id="postContent" rows="4" placeholder="Write details about the errand or delivery... (Text only is also okay!)" style="margin-top: 15px;"></textarea>
            <button class="admin-btn" onclick="createNewPost()" style="margin-bottom: 30px;">Broadcast Live Worldwide</button>

            <h3 style="color: var(--gold-light); font-size: 1.1rem; margin-bottom: 10px;">Manage / Delete Live Posts</h3>
            <div id="managePostsContainer"></div>
        </div>
    </div>

    <script>
        const SECRET_PASSWORD = "feighsecure2026";

        function checkAdminPassword() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === SECRET_PASSWORD) {
                document.getElementById('loginPanel').classList.remove('active-panel');
                document.getElementById('dashboardPanel').classList.add('active-panel');
                loadManagePosts();
            } else {
                alert('Incorrect password! Access denied.');
            }
        }

        function createNewPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const mediaInput = document.getElementById('postMedia');

            if (!content && (!mediaInput.files || !mediaInput.files[0])) {
                alert('Please add some text content or upload a photo/video reel.');
                return;
            }

            const savePostData = (mediaData, mediaType) => {
                const posts = JSON.parse(localStorage.getItem('feighPosts')) || [];
                const newPost = {
                    id: Date.now(),
                    title,
                    content,
                    mediaData: mediaData || '',
                    mediaType: mediaType || '',
                    date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    comments: []
                };
                posts.unshift(newPost);
                localStorage.setItem('feighPosts', JSON.stringify(posts));
                
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postMedia').value = '';
                alert('Successfully broadcasted live worldwide!');
                loadManagePosts();
            };

            if (mediaInput.files && mediaInput.files[0]) {
                const file = mediaInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    savePostData(e.target.result, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                savePostData();
            }
        }

        function loadManagePosts() {
            const container = document.getElementById('managePostsContainer');
            const posts = JSON.parse(localStorage.getItem('feighPosts')) || [];
            
            if (posts.length === 0) {
                container.innerHTML = `<p style="font-size: 0.85rem; color: #666;">No active posts found.</p>`;
            } else {
                container.innerHTML = '';
                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-manage-card';
                    card.innerHTML = `<span style="font-size: 0.85rem; color: #ccc;">${post.title || post.content.substring(0, 30) + '...'}</span> <button class="delete-btn" onclick="deletePost(${post.id})">Delete</button>`;
                    container.appendChild(card);
                });
            }
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('feighPosts')) || [];
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('feighPosts', JSON.stringify(posts));
            loadManagePosts();
        }
    </script>

</body>
</html>
